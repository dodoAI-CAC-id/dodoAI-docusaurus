name: mamoai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # 関数型プログラミング
  dartz: ^0.10.1

  # DI
  get_it: ^7.6.4

  # HTTP/GraphQL
  graphql_flutter: ^5.1.2
  dio: ^5.3.3

  # 動画再生
  video_player: ^2.8.1

  # QRコード
  qr_flutter: ^4.1.0

  # その他
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # テスト
  mockito: ^5.4.2
  bloc_test: ^9.1.5
  build_runner: ^2.4.6

  # Widgetbook
  widgetbook: ^3.7.1
  widgetbook_generator: ^3.7.0
  widgetbook_annotation: ^3.1.0

  # Linter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
